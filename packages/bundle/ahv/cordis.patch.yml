# The AHV bundle patch: sits over dsh-base and rewires the harness for AHV
# Holding's LLM router (auto.ahvchat.com) plus a Vietnamese-first persona.
# Applied by the `ahv` profile so `pnpm ahv "task"` needs zero config.
#
# Each row addresses a base row by id, replacing that row's `config` block
# (patch semantics — not deep merge). Row ids that don't exist in base
# would be silently ignored, so this file mirrors base's ids exactly.

# --- LLM routing ---------------------------------------------------------

# Point the default agent model at the AHV router. Provider name matches
# the route key we register in llm-pi-ai below.
- id: agent-default-model
  config:
    provider: ahv-router
    model: ahv-qwen38

# Register the AHV router as a hand-declared OpenAI-compatible route.
# Base's llm-pi-ai row starts empty; this patch replaces the whole config
# with one provider profile. Users override in ~/.dsh/settings.yaml.
- id: llm-pi-ai
  config:
    providers:
      ahv-router:
        displayName: AHV Router
        apiKeyEnv: AHV_API_KEY
        api: openai-completions
        baseURL: http://15.235.200.66:2022/v1
        # The router's virtual combos accept streaming + tool-use over the
        # OpenAI wire; capacities are guesses from public endpoint behavior.
        # A route mis-sized this way still serves — pi-ai's route defaults
        # (256K ctx / 32K max) cover unknown models — but pin the ones we
        # actually use to avoid surprise truncation.
        models:
          - id: ahv-qwen38
            name: ahv-qwen38 (default — Qwen3-8B, vision + structured tool_calls)
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding
            name: AHV-Holding (legacy alias)
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding-TroLy
            name: AHV-Holding-TroLy
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding-DEV
            name: AHV-Holding-DEV (dev combo)
            contextWindow: 128000
            maxTokens: 64000
          - id: Grok-SuperHeavy
            name: Grok SuperHeavy
            contextWindow: 128000
            maxTokens: 64000

# Turn off DeepSeek's search route so it doesn't try to authenticate with
# a DEEPSEEK_API_KEY the AHV user doesn't have. Fetch stays off in base.
- id: web-search-deepseek
  disabled: true

# The web-search tool now has no provider mounted. Disable the tool so the
# model doesn't see a broken option; add a real search provider (Brave,
# Tavily, or AHV's own once available) in a future patch.
- id: tool-web
  disabled: true

# --- Product surface ----------------------------------------------------

# Vietnamese-first persona. Kept short — plan-mode, tool descriptions, and
# per-command feedback bring the rest of the operational rules.
- id: system-prompt
  config:
    persona: >-
      Bạn là AHV CLI, agentic dev assistant chạy trong terminal của user Việt
      Nam. Model hiện tại: {{model}}. Working directory: {{cwd}}. Nói tiếng
      Việt trừ khi user gõ bằng ngôn ngữ khác. Ngắn gọn, chính xác, dùng tool
      khi cần thay vì đoán. Xác nhận với user trước mọi thay đổi phá hủy.

# --- Bundled extras (AHV opinionated defaults over base) ----------------
# Rows below are `insert`s — they add new plugin fibers rather than
# patch base rows. Every plugin here is opt-in in dsh upstream but ships
# on by default in AHV so a new user gets a fuller toolbelt out of the
# box.

- insert:
    # Persistent PTY sessions — complements one-shot `bash` with a
    # shell that survives across tool calls (SSH, tmux-like flows,
    # long-running scripts you want to poke at).
    - id: terminal-registry
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      config:
        enableRunInBackground: true

    # Self-modification runtime — the agent can inspect its own live
    # runtime and mount ephemeral in-process plugins (`cordis_inspect`,
    # `cordis_define`, `cordis_run`, `cordis_stop`, `cordis_undefine`).
    # In-memory only; nothing survives restart, no files written.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

    # Plugin Market (dsh-market/dsh-market, npm: dshmarket). Community
    # plugin catalog — browse, search, one-click install/uninstall,
    # backup/restore, hot-reload — surfaced under Settings → Plugin Market
    # in the dsh web UI. Silently disables itself under headless (no UI
    # to render into), so mounting here costs nothing when the user runs
    # `ahv` (default headless) and lights up only under `ahv --profile
    # ahv-web` where the web-app bundle brings the Settings surface.
    - id: dsh-market
      name: 'dshmarket'

    # Superpowers skill pack (LayneChai/superpowers-dsh, adapted from
    # obra/superpowers). Adds 14 curated agent skills — TDD,
    # systematic-debugging, brainstorming, writing-plans, executing-plans,
    # subagent-driven-development, using-git-worktrees, dispatching-parallel-
    # agents, verification-before-completion, requesting/receiving code
    # review, finishing-a-development-branch, writing-skills,
    # using-superpowers. Registers a skill provider into ctx.skills so the
    # model sees them via skill_list/skill_load without further config.
    - id: superpowers-dsh
      name: 'superpowers-dsh'

    # Use ChatGPT (Codex Plus), Claude Pro, Grok Premium subscriptions as
    # dsh LLM providers via `pi-ai` — no API cost when the user already
    # holds the subscription. Web mounts Settings → Subscriptions to log
    # in; headless can reuse the shared token file after first login.
    # https://github.com/V1ki/dsh-plugin-subscriptions
    - id: llm-subscriptions
      name: 'dsh-plugin-subscriptions'

    # Self-contained browser runtime — bundles Playwright + OpenCLI local,
    # provides `browser` service + interactive browser_* tools (open, read,
    # screenshot, click, type, fill, scroll, close, execute, recipe_run,
    # userscript_run, script_run_builtin, auth_profile, opencli_run…).
    # Playwright chromium là headless native → chạy được cả server prod
    # (headless) và desktop user. Cache chromium share global 400MB,
    # `browser_install` tool pull khi thiếu.
    # https://github.com/anweat/dsh-browser
    - id: browser
      name: '@anweat/dsh-browser'
