# The AHV bundle patch — WEB variant. Applied over dsh-base + dsh-web-app.
# Web-app already inserts cordis-host-runner + tool-cordis + terminal-registry
# + terminal-bash + tool-terminal, so this variant omits those to avoid
# duplicate-loader-id errors and only adds AHV-specific rewiring + the two
# extras web-app doesn't ship (dsh-market UI + superpowers-dsh skills).

# --- LLM routing (same as headless variant) -----------------------------

- id: agent-default-model
  config:
    provider: ahv-router
    model: ahv-qwen38

- id: llm-pi-ai
  config:
    providers:
      ahv-router:
        displayName: AHV Router
        apiKeyEnv: AHV_API_KEY
        api: openai-completions
        baseURL: http://15.235.200.66:2022/v1
        models:
          - id: ahv-qwen38
            name: ahv-qwen38 (default — Qwen3-8B, vision + structured tool_calls)
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding
            name: AHV-Holding (legacy alias)
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding-TroLy
            name: AHV-Holding-TroLy
            contextWindow: 128000
            maxTokens: 64000
          - id: AHV-Holding-DEV
            name: AHV-Holding-DEV (dev combo)
            contextWindow: 128000
            maxTokens: 64000
          - id: Grok-SuperHeavy
            name: Grok SuperHeavy
            contextWindow: 128000
            maxTokens: 64000

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- id: system-prompt
  config:
    persona: >-
      Bạn là AHV CLI, agentic dev assistant chạy trong terminal của user Việt
      Nam. Model hiện tại: {{model}}. Working directory: {{cwd}}. Nói tiếng
      Việt trừ khi user gõ bằng ngôn ngữ khác. Ngắn gọn, chính xác, dùng tool
      khi cần thay vì đoán. Xác nhận với user trước mọi thay đổi phá hủy.

# --- Extras web-app doesn't ship ---------------------------------------

- insert:
    - id: dsh-market
      name: 'dshmarket'
    - id: superpowers-dsh
      name: 'superpowers-dsh'
    # Use ChatGPT (Codex Plus), Claude Pro, Grok Premium subscriptions as
    # dsh LLM providers via `pi-ai` — no API cost when the user already
    # holds the subscription. Web mounts Settings → Subscriptions to log
    # in; headless can reuse the shared token file after first login.
    # https://github.com/V1ki/dsh-plugin-subscriptions
    - id: llm-subscriptions
      name: 'dsh-plugin-subscriptions'

    # Self-contained Playwright chromium + OpenCLI. See headless patch
    # for full row description. Web mode benefits from browser tool cùng
    # với UI surfaces (Plugin Market, Skill Explorer).
    - id: browser
      name: '@anweat/dsh-browser'
    # NOTE: @linxin666/dsh-web-ui-all is a BUNDLE (has nested cordis.patch.yml
    # inserting ~15 sub-plugins). It must be added via `dsh plugin --profile web
    # add @linxin666/dsh-web-ui-all` so the profile's `dsh.profile.bundles`
    # list picks it up and its patch layer applies. See install script
    # scripts/install-web-ui-all.sh.

# Disable the remote-web-ui pairing gate — its "primary computer" requirement
# blocks access via reverse proxy (basic_auth in front of Caddy already
# authenticates the user, so the extra pairing challenge is redundant here).
# Mobile QR pairing feature is lost with this off; re-enable by removing this
# patch entry if you need it.
- id: web-ui-remote-web-ui
  disabled: true

# Re-enable skill provider so @linxin666/dsh-client-ui-skill-explorer can list
# the loaded skills. web-app's Code Mode disables tool-skill on the model side,
# but the Skill Explorer panel needs the underlying `ctx.skills` provider to
# read the catalog. skill-filesystem loads ~/.dsh/skills + workspace skills.
- id: skill-filesystem
  disabled: false
