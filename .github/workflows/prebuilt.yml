# Build the prebuilt AHV CLI archive for every platform when a release tag is
# pushed, and attach it to a GitHub Release. ahvclaw.com mirrors the assets
# into its release channel (scripts/prod/mirror-prebuilt.sh).
#
# linux-x64 is built inside manylinux_2_28 (glibc 2.28), not on the runner's
# Ubuntu 24.04: the reference machine's own x64 archive needs glibc 2.39, so
# ten hosts (AlmaLinux 8/9, Ubuntu 22.04) fell back to building from source,
# and a dsh 0.2 core cannot be built there (29/09: #5 #6 broke at
# build:native-system, #1 hit 3.6 GB). The mirror swaps this archive in for
# the reference one whenever it needs an older glibc.
#
# workflow_dispatch rebuilds an existing tag; `publish` attaches the result to
# that tag's release (replacing assets of the same name), otherwise it is only
# kept as a workflow artifact for testing.
#
# The build jobs run third-party install scripts (pnpm install), so they get a
# read-only token and do not keep it in .git/config; only the publish job,
# which runs no project code, may write to the release.
name: prebuilt
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build (v0.2.x)
        required: true
      publish:
        description: attach the archives to that tag's release
        type: boolean
        default: false
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: '22.22.2'
  # CI must never report to the telemetry endpoint baked into the core.
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 90
    steps:
      - name: Toolchain (git, zstd, Node from nodejs.org)
        run: |
          set -euo pipefail
          dnf install -y -q git zstd xz >/dev/null
          git config --global --add safe.directory '*'
          cd /tmp
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" | grep " node-v$NODE_VERSION-linux-x64.tar.xz\$" | sha256sum -c -
          mkdir -p /opt/node && tar -xJf "node-v$NODE_VERSION-linux-x64.tar.xz" -C /opt/node --strip-components=1
          echo /opt/node/bin >> "$GITHUB_PATH"
          # node-gyp (node-pty) wants a modern python3 first on PATH.
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          getconf GNU_LIBC_VERSION
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      # Package and check with this workflow's own scripts, so rebuilding an
      # older tag still gets today's glibc scan and smoke checks.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _ci
          sparse-checkout: scripts/prod
          persist-credentials: false
      - name: Build the tag with the product installer
        env:
          NO_COLOR: '1'
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: |
          set -euo pipefail
          # Inside a container ${{ github.workspace }} is the runner's path; the
          # shell's GITHUB_WORKSPACE is the one mounted here.
          export AHV_HOME="$GITHUB_WORKSPACE/.ahv-build" AHV_BIN="$GITHUB_WORKSPACE/.ahv-build/bin-link" AHV_REPO_URL="file://$GITHUB_WORKSPACE"
          node -v; python3 --version; gcc --version | head -1
          corepack enable
          AHV_BRANCH="$TAG" AHV_CLI_VERSION="$TAG" bash scripts/prod/install.sh
          "$AHV_HOME/bin/ahv" --version | grep -F "$TAG"
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          bash _ci/scripts/prod/build-prebuilt.sh "$TAG" out "$GITHUB_WORKSPACE/.ahv-build/src"
          mv "out/$TAG.json" "out/$TAG-linux-x64.json"
          rm -f out/manifest.json
          cat "out/$TAG-linux-x64.json"
          # build-prebuilt.sh scans every ELF in the tree: a native module that
          # links a GLIBC_x.y above 2.28 (outside prebuilt-glibc-optional.txt)
          # raises this and would leave the old hosts behind.
          grep -q '"glibc": "2.28"' "out/$TAG-linux-x64.json"
      - name: Smoke the built tree (no login needed)
        run: |
          set -euo pipefail
          # The checks release-cli.sh runs on the reference build that need no
          # account; the real `ahv run` happens on canary hosts before a promote.
          # DeepSeek telemetry arrived with dsh 0.2; a dsh 0.1 tag has none to switch off.
          core="$(node -p "require('$GITHUB_WORKSPACE/.ahv-build/src/apps/cli/package.json').version")"
          case "$core" in
            0.0.*|0.1.*) echo "dsh $core: no telemetry rows to check" ;;
            *) bash _ci/scripts/prod/tests/test-no-telemetry.sh "$GITHUB_WORKSPACE/.ahv-build/src" --strict ;;
          esac
          # A dead shared Codex login must stay in auth.json (patches/dsh-plugin-subscriptions.patch).
          # Keyed on the tag carrying the check, so rebuilding an older tag still works.
          if [ -f scripts/prod/tests/test-codex-keep-session.mjs ]; then
            node _ci/scripts/prod/tests/test-codex-keep-session.mjs "$GITHUB_WORKSPACE/.ahv-build/src"
          fi
          bash _ci/scripts/prod/tests/test-browser-playwright.sh "$GITHUB_WORKSPACE/.ahv-build/src" --strict
      - uses: actions/upload-artifact@v4
        with:
          name: ahv-cli-${{ env.TAG }}-linux-x64
          path: out/
          retention-days: 7
          compression-level: 0
  linux-arm64:
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the tag with the product installer
        env:
          AHV_HOME: ${{ github.workspace }}/.ahv-build
          AHV_BIN: ${{ github.workspace }}/.ahv-build/bin-link
          AHV_REPO_URL: file://${{ github.workspace }}
          NO_COLOR: '1'
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
        run: |
          corepack enable
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd build-essential python3 pkg-config >/dev/null
          AHV_BRANCH="$TAG" AHV_CLI_VERSION="$TAG" bash scripts/prod/install.sh
          "$AHV_HOME/bin/ahv" --version | grep -F "$TAG"
      - name: Package
        run: |
          mkdir -p out
          bash scripts/prod/build-prebuilt.sh "$TAG" out "$GITHUB_WORKSPACE/.ahv-build/src"
          mv "out/$TAG.json" "out/$TAG-linux-arm64.json"
          rm -f out/manifest.json
          ls -la out
      - name: Smoke the built tree (no login needed)
        run: |
          set -euo pipefail
          # Tags before the Codex keep-session patch have no such check to run.
          if [ -f scripts/prod/tests/test-codex-keep-session.mjs ]; then
            node scripts/prod/tests/test-codex-keep-session.mjs "$GITHUB_WORKSPACE/.ahv-build/src"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ahv-cli-${{ env.TAG }}-linux-arm64
          path: out/
          retention-days: 7
          compression-level: 0
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [linux-x64, linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ahv-cli-${{ env.TAG }}-linux-*
          merge-multiple: true
          path: out
      - run: ls -la out && cd out && for f in *.json; do python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            out/ahv-cli-${{ env.TAG }}-linux-x64.tar.zst
            out/${{ env.TAG }}-linux-x64.json
            out/ahv-cli-${{ env.TAG }}-linux-arm64.tar.zst
            out/${{ env.TAG }}-linux-arm64.json
