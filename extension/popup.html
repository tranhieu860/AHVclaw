<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 340px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  font-size: 13px;
}
.header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-bottom: 1px solid #2962FF;
}
.logo {
  width: 32px; height: 32px;
  background: #2962FF; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 14px; color: white;
}
.header-text h1 { font-size: 15px; color: #fff; }
.header-text .subtitle { font-size: 11px; color: #888; }

/* Status indicators */
.status-panel {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.status-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0; font-size: 12px;
}
.status-label { color: #888; }
.status-value { font-weight: 500; }
.status-value.online { color: #4CAF50; }
.status-value.offline { color: #F44336; }
.status-value.waiting { color: #FF9800; }

/* Sections */
.section {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.section label {
  display: block; font-size: 11px; color: #888;
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
}
input[type="email"], input[type="password"] {
  width: 100%; padding: 8px 10px;
  background: #16213e; border: 1px solid #333; border-radius: 6px;
  color: #e0e0e0; font-size: 12px; outline: none;
}
input:focus { border-color: #2962FF; }

/* Buttons */
.btn {
  width: 100%; padding: 8px; border-radius: 6px;
  cursor: pointer; font-size: 12px; border: none; transition: all 0.2s;
}
.btn-primary { background: #2962FF; color: white; }
.btn-primary:hover { background: #1e4fd6; }
.btn-danger { background: #F44336; color: white; }
.btn-danger:hover { background: #c62828; }
.btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
.btn-outline:hover { border-color: #2962FF; color: #2962FF; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn + .btn { margin-top: 8px; }

.msg { font-size: 11px; margin-top: 6px; text-align: center; }
.msg.error { color: #F44336; }
.msg.success { color: #4CAF50; }

.logged-in-info {
  padding: 8px 12px; background: rgba(76,175,80,0.1);
  border: 1px solid rgba(76,175,80,0.2); border-radius: 6px;
  font-size: 11px; color: #4CAF50; margin-bottom: 8px;
}

/* Grant section */
.grant-section {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.grant-status {
  padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 8px;
}
.grant-status.active { background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.2); color: #4CAF50; }
.grant-status.inactive { background: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.2); color: #F44336; }

/* Kill switch */
.kill-section {
  padding: 12px 16px;
}
.kill-btn {
  width: 100%; padding: 12px; border-radius: 6px;
  background: #F44336; color: white; font-size: 14px; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.2s;
}
.kill-btn:hover { background: #c62828; }

.info-text {
  font-size: 10px; color: #555; text-align: center; padding: 8px 16px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">A</div>
  <div class="header-text">
    <h1>AHVclaw Companion</h1>
    <div class="subtitle">v2.0 — Native Helper</div>
  </div>
</div>

<!-- Status Panel -->
<div class="status-panel">
  <div class="status-row">
    <span class="status-label">Helper</span>
    <span class="status-value" id="helperStatusText">...</span>
  </div>
  <div class="status-row">
    <span class="status-label">Trình duyệt (CDP)</span>
    <span class="status-value" id="cdpStatusText">...</span>
  </div>
  <div class="status-row">
    <span class="status-label">Server</span>
    <span class="status-value" id="serverStatusText">...</span>
  </div>
  <div class="status-row">
    <span class="status-label">Tab đang quản lý</span>
    <span class="status-value" id="tabCountText">0</span>
  </div>
</div>

<!-- Login -->
<div id="loginSection">
  <div id="loginForm">
    <div class="section">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="email@example.com">
    </div>
    <div class="section">
      <label>Mật khẩu</label>
      <input type="password" id="loginPassword" placeholder="Nhập mật khẩu">
    </div>
    <div class="section">
      <button class="btn btn-primary" id="loginBtn">Đăng nhập</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
  <div id="loggedInBox" class="section" style="display:none;">
    <div class="logged-in-info" id="loggedInInfo"></div>
    <button class="btn btn-outline" id="logoutBtn">Đăng xuất</button>
  </div>
</div>

<!-- Grant / Consent -->
<div class="grant-section">
  <label>Quyền điều khiển</label>
  <div class="grant-status" id="grantStatus"></div>
  <button class="btn btn-primary" id="grantBtn" style="display:none;">Cấp quyền cho thiết bị này</button>
  <button class="btn btn-outline" id="revokeBtn" style="display:none;">Thu hồi quyền</button>
  <button class="btn btn-outline" id="retryCDPBtn" style="display:none;">Kết nối lại Chrome</button>
</div>

<!-- Kill Switch -->
<div class="kill-section">
  <button class="kill-btn" id="killBtn">Dừng ngay</button>
</div>

<div class="info-text">
  Mọi thao tác của AGI chỉ trong tab group "AHVclaw".<br>
  Nhấn "Dừng ngay" để thu hồi toàn bộ quyền.
</div>

<script src="popup.js"></script>
</body>
</html>
