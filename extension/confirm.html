<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AHVclaw — Xác nhận chuyển tab</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #e0e0e0; width: 380px; }
  h2 { font-size: 16px; margin: 0 0 12px; color: #00d2ff; }
  .tab-info { background: #16213e; border-radius: 8px; padding: 12px; margin-bottom: 16px; word-break: break-all; }
  .tab-title { font-weight: 600; margin-bottom: 4px; }
  .tab-url { font-size: 12px; color: #888; }
  .warning { font-size: 13px; color: #ffa726; margin-bottom: 16px; }
  .buttons { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-confirm { background: #00d2ff; color: #1a1a2e; }
  .btn-confirm:hover { background: #00b8e6; }
  .btn-cancel { background: #333; color: #e0e0e0; }
  .btn-cancel:hover { background: #444; }
</style>
</head>
<body>
  <h2>Chuyển tab cho AHVclaw?</h2>
  <div class="tab-info">
    <div class="tab-title" id="title"></div>
    <div class="tab-url" id="url"></div>
  </div>
  <div class="warning">
    AHVclaw AGI sẽ có quyền điều khiển tab này. Bạn có thể thu hồi bất cứ lúc nào bằng cách kéo tab ra khỏi nhóm.
  </div>
  <div class="buttons">
    <button class="btn btn-cancel" id="cancelBtn">Huỷ</button>
    <button class="btn btn-confirm" id="confirmBtn">Đồng ý</button>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
